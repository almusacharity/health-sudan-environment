<section id="join">
  <h2>التسجيل كعضو</h2>

  <p style="text-align:center; margin-bottom:20px;">
    املأ البيانات التالية، ثم اضغط إرسال طلب التسجيل.
  </p>

  <form onsubmit="sendMembershipEmail(event)">

    <input
      type="text"
      id="full_name"
      placeholder="الاسم الكامل"
      required
    >

    <input
      type="tel"
      id="phone"
      placeholder="رقم الهاتف / واتساب"
      required
    >

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      type="text"
      id="city"
      placeholder="الولاية / المدينة"
    >

    <select id="membership_type" required>
      <option value="">اختر نوع العضوية</option>
      <option>عضو متطوع</option>
      <option>عضو عادي</option>
      <option>عضو داعم</option>
    </select>

    <textarea
      id="notes"
      placeholder="ملاحظات إضافية"
    ></textarea>

    <button type="submit">
      📧 إرسال طلب التسجيل
    </button>

  </form>
</section>

<script>
function sendMembershipEmail(event) {
  event.preventDefault();

  const name = document.getElementById("full_name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const city = document.getElementById("city").value;
  const membership = document.getElementById("membership_type").value;
  const notes = document.getElementById("notes").value;

  const subject =
    "طلب تسجيل عضو جديد - منظمة الصحة السودانية لحماية البيئة";

  const body =
    "طلب تسجيل عضو جديد%0A%0A" +
    "الاسم الكامل: " + encodeURIComponent(name) + "%0A" +
    "رقم الهاتف / واتساب: " + encodeURIComponent(phone) + "%0A" +
    "البريد الإلكتروني: " + encodeURIComponent(email) + "%0A" +
    "الولاية / المدينة: " + encodeURIComponent(city) + "%0A" +
    "نوع العضوية: " + encodeURIComponent(membership) + "%0A" +
    "الملاحظات: " + encodeURIComponent(notes);

  window.location.href =
    "mailto:Hima199th@gmail.com,belal62100056@gmail.com" +
    "?subject=" + encodeURIComponent(subject) +
    "&body=" + body;
}
</script>
